spring:
  application:
    name: roadmate
  config:
    # Local secrets (DB password, API keys). Git-ignored; copy from application-local.example.yml
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roadmate}
    username: ${DB_USERNAME:roadmate}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
