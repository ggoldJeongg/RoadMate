spring:
  application:
    name: roadmate
  datasource:
    # H2 file mode: data persists in backend/data/ (git-ignored)
    url: jdbc:h2:file:./data/roadmate;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
